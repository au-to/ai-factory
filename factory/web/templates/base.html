<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Factory{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            line-height: 1.5;
        }
        nav {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        nav a { color: #94a3b8; text-decoration: none; font-size: 14px; }
        nav a:hover { color: #fff; }
        nav .brand { color: #fff; font-weight: 700; font-size: 18px; margin-right: auto; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
        h1 { font-size: 24px; margin-bottom: 16px; }
        h2 { font-size: 18px; margin: 24px 0 12px; color: #94a3b8; }
        table { width: 100%; border-collapse: collapse; margin: 12px 0; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #1e293b; font-size: 14px; }
        th { color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 12px; }
        tr:hover { background: #1e293b22; }
        a { color: #60a5fa; }
        .btn {
            display: inline-block; padding: 8px 16px; border: none; border-radius: 6px;
            font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; color: #fff;
        }
        .btn-success { background: #16a34a; }
        .btn-success:hover { background: #15803d; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-warning { background: #d97706; }
        .btn-warning:hover { background: #b45309; }
        .btn-primary { background: #2563eb; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .card {
            background: #1e293b; border: 1px solid #334155; border-radius: 8px;
            padding: 20px; margin: 12px 0;
        }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 12px; font-weight: 600;
        }
        pre { background: #0f172a; padding: 16px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
        .grid { display: grid; gap: 16px; }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .flex { display: flex; gap: 12px; align-items: center; }
        .muted { color: #64748b; font-size: 13px; }

        /* Pipeline viz */
        .pipeline {
            display: flex; align-items: center; gap: 0; margin: 24px 0;
            overflow-x: auto; padding: 8px 0;
        }
        .pipeline .stage {
            display: flex; flex-direction: column; align-items: center;
            padding: 16px 20px; border-radius: 10px; min-width: 120px;
            background: #1e293b; border: 2px solid #334155;
            transition: all 0.3s;
        }
        .pipeline .stage.active { border-color: #3b82f6; box-shadow: 0 0 12px #3b82f644; }
        .pipeline .stage.completed { border-color: #22c55e; }
        .pipeline .stage.rejected { border-color: #ef4444; }
        .pipeline .stage .icon { font-size: 28px; margin-bottom: 4px; }
        .pipeline .stage .label { font-size: 13px; color: #94a3b8; }
        .pipeline .stage .status-text { font-size: 11px; margin-top: 4px; }
        .pipeline .arrow { color: #334155; font-size: 24px; margin: 0 4px; flex-shrink: 0; }
        .pipeline .arrow.done { color: #22c55e; }

        /* Gate panel */
        .gate-panel {
            background: #292524; border: 2px solid #d97706; border-radius: 8px;
            padding: 16px 20px; margin: 16px 0;
        }
        .gate-panel h3 { color: #fbbf24; margin-bottom: 12px; }

        /* Run form */
        .run-form { display: flex; gap: 12px; margin: 16px 0; }
        .run-form input[type="text"] {
            flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155;
            background: #1e293b; color: #fff; font-size: 15px;
        }
        .run-form input[type="text"]::placeholder { color: #64748b; }

        /* Preview */
        .preview-card {
            background: #1e293b; border: 1px solid #334155; border-radius: 8px;
            padding: 20px; margin: 20px 0;
        }
        .preview-card.running { border-color: #22c55e; }
        .preview-indicator {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            margin-right: 8px; background: #64748b;
        }
        .preview-indicator.live {
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .preview-urls { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; }
        .preview-urls a {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 13px;
            background: #0f172a; border: 1px solid #334155; color: #93c5fd;
        }
        .preview-urls a:hover { border-color: #60a5fa; }

        /* Live status bar */
        .live-bar {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 16px; margin: 16px 0; border-radius: 8px;
            background: #1e3a5f; border: 1px solid #3b82f6;
        }
        .live-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #3b82f6;
            animation: pulse 1.5s infinite;
        }
        .live-bar span:last-child { color: #93c5fd; font-size: 14px; }

        /* Log viewer */
        .log-viewer {
            margin: 16px 0; border-radius: 8px; overflow: hidden;
            border: 1px solid #334155;
        }
        .log-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 14px; background: #1e293b; border-bottom: 1px solid #334155;
            font-size: 13px; font-weight: 600;
        }
        .log-viewer pre {
            margin: 0; padding: 14px; background: #0a0e1a; border-radius: 0;
            max-height: 400px; overflow-y: auto; font-size: 12px;
            line-height: 1.6; color: #94a3b8; white-space: pre-wrap; word-break: break-all;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
        }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .pipeline { flex-wrap: wrap; justify-content: center; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/" class="brand">AI Factory</a>
        <a href="/">Runs</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
